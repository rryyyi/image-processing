name: Feature request / 改进建议
description: 描述使用场景、当前限制与可验证的目标。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前问题
      description: 说明谁在什么情况下遇到限制，以及当前做法。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望能力
      description: 描述输入、输出和预期行为，区分建议和已有实现。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验收与评测方式
      description: 哪些样本、指标或行为可以判断改进有效？有哪些失败风险？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充信息
      description: 已尝试的配置、相关方法或可公开参考。
